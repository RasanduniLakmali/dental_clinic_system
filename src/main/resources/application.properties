spring.application.name=dental-clinic-system

# MySQL running under WAMP. WAMP's default MySQL port is 3306, default user
# "root" with an empty password. Create the schema first in phpMyAdmin:
#   CREATE DATABASE dentalclinic;
# (see README "WAMP setup" section) - Hibernate creates the tables for you.
spring.datasource.url=jdbc:mysql://localhost:3306/dentalclinic?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=rasa@1234

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Serves the HTML/CSS/JS frontend from src/main/resources/static on the
# same origin as the API, so the browser needs no CORS configuration.
server.port=8080

# --- Email (used when Admin creates a Dentist/Receptionist account) -------
# app.mail.enabled=false by default so the project runs out of the box in
# NetBeans without a real mailbox: staff creation still works and the
# generated username/password are simply shown once on screen instead.
# To send real emails, set app.mail.enabled=true and fill in a Gmail App
# Password (Google Account > Security > App passwords) below.
app.mail.enabled=true
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=rasandunilakmali26@gmail.com
spring.mail.password=lnmr pjaa pnuo kfvq
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Reference DDL only (see src/main/resources/db/schema.sql) - table creation
# itself is handled by spring.jpa.hibernate.ddl-auto=update above, so this
# stays "never" to avoid the two mechanisms fighting over the same tables.
spring.sql.init.mode=never
